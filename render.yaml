# Render blueprint for the content agent.
# Default: a cron job that runs the schedule and drains the job queue every 5 minutes (metered per minute,
# ~$1/month minimum). For instant admin actions, switch to the background worker below (~$7/month).
services:
  - type: cron
    name: pizzascript-agent
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: npm run worker -- --once
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GSC_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GSC_SITE_URL
        value: sc-domain:pizzascript.com
      - key: SITE_URL
        value: https://www.pizzascript.com
      - key: REVALIDATE_SECRET
        sync: false

  # Always-on alternative — replace the cron service above with this to process jobs within seconds.
  # - type: worker
  #   name: pizzascript-agent
  #   runtime: node
  #   plan: starter
  #   buildCommand: npm ci
  #   startCommand: npm run worker
  #   envVars: (same as above)
