name: Content agent

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes, UTC
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

concurrency:
  group: content-agent
  cancel-in-progress: false # never kill a run mid-job; let it finish, skip overlap instead

jobs:
  run-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run worker -- --once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: "sc-domain:pizzascript.com"
          SITE_URL: "https://www.pizzascript.com"
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
